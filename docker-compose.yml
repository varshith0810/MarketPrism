services:
  marketprism:
    build:
      context: .
      dockerfile: Dockerfile
    image: marketprism:latest
    container_name: marketprism-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
